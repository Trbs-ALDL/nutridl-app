<!doctype html>
<!-- Gráfico destacado de Google Play (1024×500). Para regenerar el PNG: captura con Chrome sin ventana
     (chrome.exe --headless --screenshot=<salida> --window-size=1080,620 --hide-scrollbars --allow-file-access-from-files <este archivo>)
     y recorta la esquina superior izquierda a 1024×500 (Chrome deja márgenes blancos si la ventana mide justo 1024×500). -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  html { background: #0d0b0a; }
  body { background: radial-gradient(circle at 82% 30%, rgba(154,107,64,.45), transparent 55%), linear-gradient(160deg, #1f1915, #0d0b0a);
         color: #f2ebe3; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 56px; padding: 0 64px; box-sizing: border-box; }
  img { width: 200px; height: 200px; flex: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,.45)); }
  h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 66px; line-height: 1.02; margin: 0 0 18px; letter-spacing: -.02em; }
  h1 span { color: #dcc19c; }
  p { margin: 0 0 22px; font-size: 25px; color: #cfc4b8; font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; flex-wrap: wrap; }
  li { font-size: 19px; font-weight: 800; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(220,193,156,.35); }
</style>
</head>
<body>
  <img src="../../icons/icon.svg" alt="">
  <div>
    <h1>Tu entrenador<br><span>nutricional personal</span></h1>
    <p>Calorías, macros, comidas, gym y progreso.</p>
    <ul><li>Escáner gratis</li><li>Sin anuncios</li><li>Productos Hacendado</li></ul>
  </div>
</body>
</html>
